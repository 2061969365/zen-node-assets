name: test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ASSETS_BASE_URL: https://github.com/2061969365/zen-node-assets/releases/download/v2026.11.27

jobs:
  smoke:
    name: smoke-${{ matrix.template }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: vpngate
            assets: "zen-direct sing-box vpngate_to_singbox.py probe_and_select_vpngate.py sha256sums.txt"
          - template: warp
            assets: "zen-direct sing-box wgcf sha256sums.txt"
          - template: warp-wireproxy
            assets: "zen-direct wireproxy wgcf sha256sums.txt"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: syntax
        run: node --check "${{ matrix.template }}/index.js"

      - name: assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets
          for f in ${{ matrix.assets }}; do
            curl -fsSL --retry 3 -o "/tmp/assets/$f" "$ASSETS_BASE_URL/$f"
          done
          cd /tmp/assets
          sha256sum -c --ignore-missing sha256sums.txt

      - name: smoke
        env:
          PORT: "18080"
          ZEN_PORT: "18081"
          EGRESS_PORT: "18082"
          NODE_TOKEN: test
          EGRESS_MODE: direct
          LOG_DIR: .zen-${{ matrix.template }}
        run: |
          set -euo pipefail
          node "${{ matrix.template }}/index.js" > /tmp/node-${{ matrix.template }}.log 2>&1 &
          node_pid=$!
          cleanup() {
            kill "$node_pid" 2>/dev/null || true
            wait "$node_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "wait healthz"
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$PORT/healthz" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$PORT/healthz"

          echo "wait gateway health"
          code=""
          for i in $(seq 1 150); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "http://127.0.0.1:$PORT/health" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          [ "$code" = "200" ]
          grep -q '"run_id"' /tmp/health.json

          echo "status"
          for i in $(seq 1 60); do
            curl -fsS -H "Authorization: Bearer test" "http://127.0.0.1:$PORT/_zen/node/v1/status" > /tmp/status.json
            if grep -q '"state":"running"' /tmp/status.json; then break; fi
            sleep 1
          done
          cat /tmp/status.json
          grep -q '"state":"running"' /tmp/status.json

          echo "auth required"
          if curl -fsS "http://127.0.0.1:$PORT/_zen/node/v1/status" >/dev/null 2>&1; then
            echo "expected 401 without token"
            exit 1
          fi

          echo "v1 sse"
          v1_code=$(curl -sS -o /tmp/sse.txt -w '%{http_code}' --max-time 45 -N \
            -H "Authorization: Bearer public" \
            -H "Content-Type: application/json" \
            -d '{"model":"deepseek-v4.1-flash-free","messages":[{"role":"user","content":"Reply with ok"}],"max_tokens":8,"stream":true}' \
            "http://127.0.0.1:$PORT/v1/chat/completions" || true)
          echo "v1 status=$v1_code"
          head -c 400 /tmp/sse.txt || true
          case "$v1_code" in
            200|429) ;;
            *) echo "unexpected v1 status $v1_code"; exit 1 ;;
          esac

          echo "restart"
          curl -fsS -X POST -H "Authorization: Bearer test" "http://127.0.0.1:$PORT/_zen/node/v1/restart" >/dev/null
          sleep 2
          code=""
          for i in $(seq 1 150); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/health" || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ]

          echo "stop/start"
          curl -fsS -X POST -H "Authorization: Bearer test" "http://127.0.0.1:$PORT/_zen/node/v1/stop" >/dev/null
          stop_code=""
          for i in $(seq 1 30); do
            stop_code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/health" || true)
            [ "$stop_code" = "503" ] && break
            [ "$stop_code" = "000" ] && break
            sleep 1
          done
          echo "after stop health=$stop_code"
          [ "$stop_code" = "503" ] || [ "$stop_code" = "000" ]
          curl -fsS -X POST -H "Authorization: Bearer test" "http://127.0.0.1:$PORT/_zen/node/v1/start" >/dev/null
          code=""
          for i in $(seq 1 150); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/health" || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ]

          echo "rotate"
          curl -fsS -X POST -H "Authorization: Bearer test" "http://127.0.0.1:$PORT/_zen/node/v1/rotate" >/dev/null
          sleep 2
          code=""
          for i in $(seq 1 150); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/health" || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ]

          echo "watchdog"
          curl -fsS -H "Authorization: Bearer test" "http://127.0.0.1:$PORT/_zen/node/v1/status" > /tmp/status2.json
          gw_pid=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/status2.json","utf8"));process.stdout.write(String(j.pid||0))')
          echo "gateway pid=$gw_pid"
          if [ "$gw_pid" != "0" ]; then kill -9 "$gw_pid" 2>/dev/null || true; fi
          sleep 2
          code=""
          for i in $(seq 1 180); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/health" || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "after watchdog health=$code"
          [ "$code" = "200" ]

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.template }}-logs
          include-hidden-files: true
          path: |
            .zen-${{ matrix.template }}/*.log
            .zen-${{ matrix.template }}/*.json
            .zen-${{ matrix.template }}/*.txt
            /tmp/node-${{ matrix.template }}.log
            /tmp/health.json
            /tmp/status.json
            /tmp/status2.json
            /tmp/sse.txt
          if-no-files-found: ignore

  egress:
    name: egress-${{ matrix.template }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: vpngate
          - template: warp
          - template: warp-wireproxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: egress
        env:
          PORT: "18080"
          ZEN_PORT: "18081"
          EGRESS_PORT: "18082"
          NODE_TOKEN: test
          EGRESS_MODE: auto
          ALLOW_DIRECT_FALLBACK: "1"
          LOG_DIR: .zen-egress-${{ matrix.template }}
          VPNGATE_MAX_CANDIDATES: "20"
          VPNGATE_KEEP_NODES: "3"
          VPNGATE_CONCURRENCY: "5"
        run: |
          set -euo pipefail
          node "${{ matrix.template }}/index.js" > /tmp/egress-${{ matrix.template }}.log 2>&1 &
          node_pid=$!
          cleanup() {
            kill "$node_pid" 2>/dev/null || true
            wait "$node_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          code=""
          for i in $(seq 1 900); do
            code=$(curl -s -o /tmp/egress-health.json -w '%{http_code}' "http://127.0.0.1:$PORT/health" || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          cat /tmp/egress-health.json 2>/dev/null || true
          [ "$code" = "200" ]

          egress_ip=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/egress-health.json","utf8"));process.stdout.write(String(j.egress_ip||""))')
          runner_ip=$(curl -fsS --max-time 15 https://api.ipify.org || true)
          echo "egress_ip=$egress_ip runner_ip=$runner_ip"
          if [ -z "$egress_ip" ]; then
            echo "::warning::no egress_ip reported"
          elif [ "$egress_ip" = "$runner_ip" ]; then
            echo "::warning::${{ matrix.template }} fell back to runner egress"
          else
            echo "::notice::${{ matrix.template }} egress is different from runner"
          fi

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egress-${{ matrix.template }}-logs
          include-hidden-files: true
          path: |
            .zen-egress-${{ matrix.template }}/*.log
            .zen-egress-${{ matrix.template }}/*.json
            .zen-egress-${{ matrix.template }}/*.txt
            /tmp/egress-${{ matrix.template }}.log
            /tmp/egress-health.json
          if-no-files-found: ignore

  update:
    name: update-${{ matrix.template }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: vpngate
          - template: warp
          - template: warp-wireproxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: self-update
        env:
          PORT: "18080"
          ZEN_PORT: "18081"
          EGRESS_PORT: "18082"
          NODE_TOKEN: test
          EGRESS_MODE: direct
          ZEN_UPDATE_RESTART_MODE: exec
          LOG_DIR: .zen-update-${{ matrix.template }}
        run: |
          set -euo pipefail
          tpl="${{ matrix.template }}"
          node "$tpl/index.js" > "/tmp/update-$tpl.log" 2>&1 &
          node_pid=$!
          cleanup() {
            pkill -f "$tpl/index.js" 2>/dev/null || true
            wait "$node_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          cat > /tmp/ver.js <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(String(j.version || ''));
          NODE
          cat > /tmp/mkver.js <<'NODE'
          const v = process.argv[2].split('.');
          v[v.length - 1] = String(Number(v[v.length - 1]) + 1);
          process.stdout.write(v.join('.'));
          NODE
          cat > /tmp/patch.js <<'NODE'
          const fs = require('fs');
          const [src, dst, from, to] = process.argv.slice(2);
          let s = fs.readFileSync(src, 'utf8');
          const a = `const VERSION = ${JSON.stringify(from)}`;
          const b = `const VERSION = ${JSON.stringify(to)}`;
          if (!s.includes(a)) { console.error('version marker not found'); process.exit(1); }
          fs.writeFileSync(dst, s.replace(a, b));
          NODE
          cat > /tmp/body.js <<'NODE'
          const fs = require('fs');
          const [src, tpl, ver, sha] = process.argv.slice(2);
          const content = fs.readFileSync(src).toString('base64');
          fs.writeFileSync('/tmp/update-body.json', JSON.stringify({
            template: tpl, version: ver, sha256: sha, content, restart: true, restartMode: 'exec',
          }));
          NODE
          cat > /tmp/bad.js <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('/tmp/update-body.json', 'utf8'));
          j.sha256 = '0'.repeat(64);
          fs.writeFileSync('/tmp/update-bad.json', JSON.stringify(j));
          NODE

          echo "wait healthz"
          for i in $(seq 1 60); do
            curl -fsS "http://127.0.0.1:$PORT/healthz" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$PORT/healthz"

          echo "wait manifest"
          for i in $(seq 1 120); do
            curl -fsS --max-time 3 -H "Authorization: Bearer test" \
              "http://127.0.0.1:$PORT/_zen/node/v1/manifest" > /tmp/update-manifest.json 2>/dev/null && break
            sleep 1
          done
          cat /tmp/update-manifest.json
          old_version=$(node /tmp/ver.js /tmp/update-manifest.json)
          echo "old_version=$old_version"
          test -n "$old_version"

          new_version=$(node /tmp/mkver.js "$old_version")
          echo "new_version=$new_version"
          node /tmp/patch.js "$tpl/index.js" /tmp/update-new.js "$old_version" "$new_version"
          sha=$(sha256sum /tmp/update-new.js | awk '{print $1}')
          node /tmp/body.js /tmp/update-new.js "$tpl" "$new_version" "$sha"

          echo "bad sha"
          node /tmp/bad.js
          bad_code=$(curl -sS -o /tmp/update-bad-resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer test" -H "Content-Type: application/json" \
            --data-binary @/tmp/update-bad.json \
            "http://127.0.0.1:$PORT/_zen/node/v1/update")
          echo "bad sha status=$bad_code body=$(cat /tmp/update-bad-resp.json)"
          [ "$bad_code" = "400" ]

          echo "apply update"
          code=$(curl -sS -o /tmp/update-resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer test" -H "Content-Type: application/json" \
            --data-binary @/tmp/update-body.json \
            "http://127.0.0.1:$PORT/_zen/node/v1/update")
          echo "update status=$code body=$(cat /tmp/update-resp.json)"
          [ "$code" = "202" ]

          echo "wait new version"
          ok=0
          for i in $(seq 1 120); do
            if curl -fsS --max-time 3 -H "Authorization: Bearer test" \
              "http://127.0.0.1:$PORT/_zen/node/v1/manifest" > /tmp/update-manifest2.json 2>/dev/null; then
              v=$(node /tmp/ver.js /tmp/update-manifest2.json)
              if [ "$v" = "$new_version" ]; then ok=1; break; fi
            fi
            sleep 1
          done
          cat /tmp/update-manifest2.json 2>/dev/null || true
          [ "$ok" = "1" ]

          echo "backup check"
          grep -q "const VERSION = '$old_version'" "$tpl/index.js.bak"
          grep -q "const VERSION = '$new_version'" "$tpl/index.js"

          echo "rollback"
          code=$(curl -sS -o /tmp/rollback-resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer test" -H "Content-Type: application/json" \
            -d '{"restart":true}' \
            "http://127.0.0.1:$PORT/_zen/node/v1/rollback")
          echo "rollback status=$code body=$(cat /tmp/rollback-resp.json)"
          [ "$code" = "202" ]

          ok=0
          for i in $(seq 1 120); do
            if curl -fsS --max-time 3 -H "Authorization: Bearer test" \
              "http://127.0.0.1:$PORT/_zen/node/v1/manifest" > /tmp/update-manifest3.json 2>/dev/null; then
              v=$(node /tmp/ver.js /tmp/update-manifest3.json)
              if [ "$v" = "$old_version" ]; then ok=1; break; fi
            fi
            sleep 1
          done
          cat /tmp/update-manifest3.json 2>/dev/null || true
          [ "$ok" = "1" ]
          echo "self-update ok: $old_version -> $new_version -> $old_version"

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.template }}-logs
          include-hidden-files: true
          path: |
            .zen-update-${{ matrix.template }}/*.log
            .zen-update-${{ matrix.template }}/*.json
            /tmp/update-${{ matrix.template }}.log
            /tmp/update-*.json
            /tmp/rollback-resp.json
            ${{ matrix.template }}/index.js.bak
          if-no-files-found: ignore
